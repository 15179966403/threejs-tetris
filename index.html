<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Tetris · Three.js</title>
    <style>
      :root {
        --panel: rgba(12, 18, 42, 0.82);
        --border: rgba(120, 160, 255, 0.28);
        --accent: #00f2fe;
        --accent-glow: rgba(0, 242, 254, 0.5);
        --text: #f8fafc;
        --muted: #94a3b8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 50% 30%, #111a38 0%, #060914 100%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        user-select: none;
      }
      #app, #app canvas { position: fixed; inset: 0; }

      /* ---------- HUD ---------- */
      #hud {
        position: fixed;
        top: 20px; left: 24px; right: 24px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
        z-index: 10;
      }
      .panel {
        background: linear-gradient(180deg, rgba(18, 26, 56, 0.85) 0%, rgba(8, 12, 28, 0.92) 100%);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 22px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }
      .stats { display: flex; gap: 32px; }
      .stat { display: flex; flex-direction: column; gap: 4px; }
      .label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: var(--muted);
      }
      .value {
        font-size: 24px;
        font-weight: 800;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 16px var(--accent-glow);
      }
      #next-grid {
        display: grid;
        grid-template-columns: repeat(4, 18px);
        grid-auto-rows: 18px;
        gap: 4px;
        margin-top: 10px;
        padding: 6px;
        background: rgba(5, 8, 20, 0.5);
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      #next-grid div {
        border-radius: 4px;
        transition: background 0.15s;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35);
      }

      /* ---------- 浮层 ---------- */
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(4, 6, 16, 0.75);
        backdrop-filter: blur(8px);
        z-index: 20;
      }
      #overlay.hidden { display: none; }
      .dialog {
        text-align: center;
        padding: 44px 58px;
        max-width: 480px;
        border: 1px solid rgba(120, 160, 255, 0.35);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 242, 254, 0.15);
      }
      .dialog h1 {
        font-size: 38px;
        font-weight: 800;
        letter-spacing: 0.12em;
        margin-bottom: 16px;
        color: #ffffff;
        text-shadow: 0 0 24px var(--accent-glow);
      }
      .dialog p { color: #cbd5e1; line-height: 1.9; margin-bottom: 28px; font-size: 15px; }
      .dialog b { color: var(--accent); font-size: 19px; }
      .dialog button {
        pointer-events: auto;
        cursor: pointer;
        border: 1.5px solid #00f2fe;
        border-radius: 12px;
        padding: 14px 46px;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: #ffffff;
        background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%);
        box-shadow: 0 0 24px rgba(0, 242, 254, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.55);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .dialog button:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 0 36px rgba(0, 242, 254, 0.8);
      }

      /* ---------- 连锁提示 ---------- */
      #combo {
        position: fixed;
        left: 50%; top: 34%;
        transform: translate(-50%, -50%);
        font-size: 46px; font-weight: 900; letter-spacing: 0.08em;
        color: #00f2fe;
        text-shadow: 0 0 30px rgba(0, 242, 254, 0.85);
        pointer-events: none; opacity: 0;
        transition: opacity 0.15s, transform 0.15s;
        z-index: 15;
      }
      #combo.on { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }

      /* ---------- 底部按键提示 ---------- */
      #controls {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        font-weight: 600;
        color: #718096;
        letter-spacing: 0.08em;
        white-space: nowrap;
        background: rgba(10, 15, 34, 0.75);
        padding: 6px 18px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(6px);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div class="panel stats">
        <div class="stat"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
        <div class="stat"><span class="label">LINES</span><span class="value" id="lines">0</span></div>
        <div class="stat"><span class="label">LEVEL</span><span class="value" id="level">1</span></div>
        <div class="stat" id="mode-stat" style="cursor: pointer;" title="点击或按 M 键切换模式"><span class="label">MODE</span><span class="value" id="game-mode" style="font-size: 18px; color: #facc15;">特技</span></div>
        <div class="stat" id="items-stat" title="G/1: 垂直重力(⤓) | H/2: 水平重力(↔)"><span class="label">ITEMS</span><span class="value" id="game-items" style="font-size: 16px; color: #38bdf8;">0/5</span></div>
      </div>
      <div class="panel" id="ai-panel" style="display: flex; flex-direction: column; gap: 4px; min-width: 160px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span class="label">LAYA AI 托管</span>
          <span id="ai-dot" style="width: 8px; height: 8px; border-radius: 50%; background: #64748b; transition: background 0.2s;"></span>
        </div>
        <span class="value" id="ai-status" style="font-size: 15px; color: #94a3b8; font-weight: 700;">OFF (按 A 键开启)</span>
        <span id="ai-thought" style="font-size: 10px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;">—</span>
      </div>
      <div class="panel">
        <div class="label">NEXT</div>
        <div id="next-grid"></div>
      </div>
    </div>

    <div id="overlay">
      <div class="panel dialog">
        <h1 id="overlay-title">3D TETRIS</h1>
        <p id="overlay-text"></p>
        <button id="overlay-btn">开始游戏</button>
      </div>
    </div>

    <div id="controls">← → 移动　·　↑ / X 旋转　·　Z 反转　·　↓ 软降　·　空格 硬降　·　G/1 垂直重力　·　H/2 水平重力　·　A 托管　·　M 模式　·　P 暂停　·　R 重开</div>
    <div id="combo"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
